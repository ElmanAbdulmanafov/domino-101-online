<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <title>Domino Online</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div class="brand">
          <div class="brand-mark">5</div>
          <div>
            <p class="eyebrow">Online masa</p>
            <h1>Domino</h1>
          </div>
        </div>
        <div id="connection" class="connection">Qosulur...</div>
      </section>

      <section id="auth" class="setup auth-panel">
        <div class="choice-group" aria-label="Hesab emeliyyati">
          <button id="authLoginButton" class="choice active" type="button">Giris</button>
          <button id="authCreateButton" class="choice" type="button">Yeni hesab</button>
        </div>
        <label class="create-only">
          Ad soyad
          <input id="registerNameInput" maxlength="18" placeholder="Mes: Elman" autocomplete="name" />
        </label>
        <label>
          Istifadeci adi
          <input id="registerUsernameInput" maxlength="24" placeholder="Mes: elman101" autocomplete="username" />
        </label>
        <label>
          Parol
          <input id="registerPasswordInput" minlength="4" maxlength="32" placeholder="Parol" type="password" autocomplete="current-password" />
        </label>
        <label class="avatar-picker create-only">
          Profil sekli
          <input id="avatarInput" type="file" accept="image/*" />
          <span id="avatarPreview" class="avatar-preview">?</span>
        </label>
        <button id="registerButton" class="primary" type="button">Giris et</button>
        <p id="authError" class="error"></p>
      </section>

      <section id="setup" class="setup hidden">
        <div class="profile-bar">
          <span id="profileAvatar" class="avatar-preview small">?</span>
          <div>
            <p class="eyebrow">Profil</p>
            <strong id="profileName">Oyuncu</strong>
            <small id="profileStats">0 oyun · 0 qalibiyyet</small>
          </div>
          <button id="soundToggleButton" type="button">Ses: aciq</button>
          <button id="logoutButton" type="button">Cixis</button>
        </div>

        <details class="profile-edit">
          <summary>Profili duzelt</summary>
          <label>
            Ad soyad
            <input id="profileNameInput" maxlength="18" autocomplete="name" />
          </label>
          <label>
            Istifadeci adi
            <input id="profileUsernameInput" maxlength="24" autocomplete="username" />
          </label>
          <label class="avatar-picker">
            Profil sekli
            <input id="profileAvatarInput" type="file" accept="image/*" />
            <span id="profileAvatarPreview" class="avatar-preview">?</span>
          </label>
          <button id="saveProfileButton" type="button">Yadda saxla</button>
        </details>

        <label>
          Adin
          <input id="nameInput" maxlength="18" placeholder="Mes: Elman" autocomplete="nickname" />
        </label>

        <div class="choice-group" aria-label="Oyun novu">
          <button id="game101Button" class="choice active" type="button">101</button>
          <button id="gamePhoneButton" class="choice" type="button">Telefon</button>
        </div>

        <div class="choice-group" aria-label="Oynama formasi">
          <button id="onlineModeButton" class="choice active" type="button">Online</button>
          <button id="botModeButton" class="choice" type="button">Botla oyna</button>
        </div>

        <div id="botCountWrap" class="bot-count" hidden>
          <span>Bot sayi</span>
          <div class="choice-group compact" aria-label="Bot sayi">
            <button id="botOneButton" class="choice active" type="button">1</button>
            <button id="botTwoButton" class="choice" type="button">2</button>
            <button id="botThreeButton" class="choice" type="button">3</button>
          </div>
        </div>

        <details class="server-settings">
          <summary>Server ayari</summary>
          <label>
            Server
            <input id="serverInput" placeholder="192.168.1.6:4173" inputmode="url" />
          </label>
        </details>

        <div class="actions">
          <button id="createRoomButton" class="primary">Otaq yarat</button>
          <div id="joinByCode" class="join">
            <input id="roomInput" maxlength="6" placeholder="Otaq kodu" />
            <button id="joinRoomButton">Qosul</button>
          </div>
        </div>

        <div id="lobby" class="lobby">
          <div class="lobby-head">
            <p class="eyebrow">Hazir otaqlar</p>
            <button id="refreshRoomsButton" type="button">Yenile</button>
          </div>
          <div id="roomList" class="room-list"></div>
        </div>

        <div class="profile-history">
          <div class="lobby-head">
            <p class="eyebrow">Oyun tarixcem</p>
            <button id="refreshHistoryButton" type="button">Yenile</button>
          </div>
          <div id="profileHistory" class="profile-history-list"></div>
        </div>

        <div class="leaderboard-panel">
          <div class="lobby-head">
            <p class="eyebrow">Reytinq</p>
            <button id="refreshLeaderboardButton" type="button">Yenile</button>
          </div>
          <div class="leader-tabs" aria-label="Reytinq novu">
            <button id="leaderWinsButton" class="choice active" type="button">Qalibiyyet</button>
            <button id="leaderPointsButton" class="choice" type="button">Xal</button>
            <button id="leaderGamesButton" class="choice" type="button">Oyun</button>
          </div>
          <div id="leaderboardList" class="leaderboard-list"></div>
        </div>

        <p id="error" class="error"></p>
      </section>

      <section id="room" class="room hidden">
        <div class="room-head">
          <div>
            <p id="roomMeta" class="eyebrow">Otaq kodu</p>
            <button id="copyCodeButton" class="code">------</button>
          </div>
          <div class="room-actions">
            <div id="roundBadge" class="round-badge">El 0</div>
            <button id="inviteButton" type="button">Devet et</button>
            <button id="leaveRoomButton" type="button">Oyundan cix</button>
            <button id="startButton" class="primary">Baslat</button>
          </div>
        </div>

        <p id="message" class="message"></p>

        <div class="table-area">
          <div id="seatTop" class="seat seat-top"></div>
          <div id="seatLeft" class="seat seat-left"></div>
          <div id="board" class="board"></div>
          <div id="seatRight" class="seat seat-right"></div>
          <div id="seatBottom" class="seat seat-bottom"></div>
        </div>

        <div class="playbar">
          <button id="playLeftButton">Sola qoy</button>
          <button id="passButton">Pass / das gotur</button>
          <button id="playRightButton">Saga qoy</button>
          <button id="playPhoneTopButton" class="phone-action" hidden>Telefon ust</button>
          <button id="playPhoneBottomButton" class="phone-action" hidden>Telefon alt</button>
        </div>

        <div id="hand" class="hand"></div>

        <section class="chat-panel">
          <div class="chat-head">
            <p class="eyebrow">Masa sohbeti</p>
            <span id="chatCount">0</span>
          </div>
          <div id="chatList" class="chat-list"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" maxlength="180" placeholder="Mesaj yaz..." autocomplete="off" />
            <button id="chatSendButton" type="submit">Gonder</button>
          </form>
        </section>

        <section class="score-panel">
          <div class="score-head">
            <p class="eyebrow">Xal cedveli</p>
            <strong id="scoreTarget">0</strong>
          </div>
          <div id="scoreboard" class="scoreboard"></div>
        </section>

        <div class="history">
          <p class="eyebrow">Gedisler</p>
          <div id="log"></div>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
